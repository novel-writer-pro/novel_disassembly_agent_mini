[supervisord]
nodaemon=true
user=root
logfile=/data/logs/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface.make_main_rpcinterface

[program:api]
command=uvicorn apps.api.app.fastapi_app:app --host %(ENV_NOVEL_ANALYZER_API_HOST)s --port %(ENV_NOVEL_ANALYZER_API_PORT)s --workers 2 --proxy-headers
directory=/app
autostart=true
autorestart=true
startretries=10
stopwaitsecs=20
stdout_logfile=/data/logs/api.stdout.log
stderr_logfile=/data/logs/api.stderr.log
stdout_logfile_maxbytes=20MB
stderr_logfile_maxbytes=20MB
environment=PYTHONPATH="/app"

[program:web]
command=node node_modules/next/dist/bin/next start -p %(ENV_NOVEL_ANALYZER_WEB_PORT)s -H 0.0.0.0
directory=/app/apps/web
autostart=true
autorestart=true
startretries=10
stopwaitsecs=20
stdout_logfile=/data/logs/web.stdout.log
stderr_logfile=/data/logs/web.stderr.log
stdout_logfile_maxbytes=20MB
stderr_logfile_maxbytes=20MB
environment=NODE_ENV="production"
