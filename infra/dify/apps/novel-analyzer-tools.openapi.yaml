openapi: 3.1.0
info:
  title: Novel Analyzer Tools (for Dify Custom Tool)
  description: |
    Endpoints exposed by ai-books for use as Dify custom tools.
    Dify connects from container, so use host.docker.internal:8001.
  version: 0.3.0

servers:
  - url: http://host.docker.internal:8001
    description: Local Linux/Docker host

paths:
  /api/search-branch:
    post:
      operationId: search_chapter
      summary: Hybrid search over chapter content
      description: |
        BM25 + vector + rerank search across a branch's chapters.
        Use this when the user asks "where in the book did X happen?".
      parameters:
        - name: X-User-Id
          in: header
          required: false
          schema:
            type: string
            default: "local-default"
          description: |
            Forwarded from Dify systemVariables.user_id.
            Backend uses this for owner_user_id scoping (currently
            applied to /api/library only; other endpoints accept any
            caller). Empty string is treated as "local-default".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [branch_id, query]
              properties:
                branch_id:
                  type: string
                  description: The branch UUID. Get from Dify variable {{branch_id}}.
                query:
                  type: string
                  description: Natural-language search query.
                top_k:
                  type: integer
                  default: 10
      responses:
        '200':
          description: Search hits
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        chapter_index:
                          type: integer
                        score:
                          type: number
                        snippet:
                          type: string

  /api/ask-branch:
    post:
      operationId: ask_branch
      summary: RAG-grounded Q&A over a branch
      description: |
        Returns an answer grounded in retrieved chapters with citations.
        Use this for content questions like "what is the protagonist's motivation?".
      parameters:
        - name: X-User-Id
          in: header
          required: false
          schema:
            type: string
            default: "local-default"
          description: |
            Forwarded from Dify systemVariables.user_id.
            Backend uses this for owner_user_id scoping (currently
            applied to /api/library only; other endpoints accept any
            caller). Empty string is treated as "local-default".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [branch_id, question]
              properties:
                branch_id:
                  type: string
                question:
                  type: string
      responses:
        '200':
          description: Answer with citations
          content:
            application/json:
              schema:
                type: object
                properties:
                  answer:
                    type: string
                  used_chapters:
                    type: array
                    items:
                      type: integer
                  evidence:
                    type: array
                    items:
                      type: object

  /api/chapter-source:
    get:
      operationId: get_chapter_source
      summary: Retrieve raw chapter text
      description: |
        Get the original source text of a specific chapter.
        Use this when you need the verbatim content (e.g. style imitation).
      parameters:
        - name: branch_id
          in: query
          required: true
          schema:
            type: string
        - name: chapter_index
          in: query
          required: true
          schema:
            type: integer
        - name: X-User-Id
          in: header
          required: false
          schema:
            type: string
            default: "local-default"
          description: |
            Forwarded from Dify systemVariables.user_id.
            Backend uses this for owner_user_id scoping where applicable.
      responses:
        '200':
          description: Chapter source
          content:
            application/json:
              schema:
                type: object
                properties:
                  chapter_index:
                    type: integer
                  title:
                    type: string
                  content:
                    type: string
