app:
  description: 协助作家在 Writer Studio 中进行章节生成、风格仿写、伏笔追溯。
  icon: 🖋️
  icon_background: '#FEF3C7'
  mode: chat
  name: Writer Copilot
kind: app
model_config:
  agent_mode:
    enabled: false
    max_iteration: 5
    strategy: react
    tools: []
  annotation_reply:
    enabled: false
  chat_prompt_config: {}
  completion_prompt_config: {}
  dataset_configs:
    datasets:
      datasets: []
    retrieval_model: multiple
  dataset_query_variable: ''
  external_data_tools: []
  file_upload:
    enabled: false
  model:
    completion_params:
      max_tokens: 2048
      temperature: 0.7
      top_p: 0.9
    mode: chat
    name: gpt-4o-mini
    provider: openai
  more_like_this:
    enabled: false
  opening_statement: |
    我是你的 Writer Copilot。我可以：
    • 帮你查找小说里某段剧情、伏笔、人物关系
    • 基于已写章节进行风格仿写或片段续写
    • 给出节奏 / 张力 / 风格建议

    告诉我你的 branch_id 和你想做什么。
  pre_prompt: |
    你是「Writer Copilot」，作家小说创作助手。

    上下文变量：
    - branch_id: {{branch_id}}
    - user_id: {{user_id}}
    - current_chapter: {{current_chapter}}

    工作守则：
    1. 用户问"剧情/人物/伏笔"类问题 → 调 ask_branch tool 或 search_chapter tool 取得 grounding
    2. 用户要"仿写/续写/段落改写" → 先用 search_chapter 取参考素材，再生成
    3. 回答必须**附带章节引用**，格式：[第 N 章] 或 [第 M-N 章]
    4. 不知道就说不知道，不要瞎编人物或事件
    5. 风格分析涉及到 Loom 信号时，建议用户在右栏 Loom Tab 查看实时数值
    6. 调用任何 tool 时，把当前 user_id 作为 X-User-Id header 传递给后端（在 Dify Studio 中
       到 Tool 调用页签 → Headers → X-User-Id 映射到 systemVariables.user_id）

  prompt_type: simple
  retriever_resource:
    enabled: true
  sensitive_word_avoidance:
    configs: []
    enabled: false
  speech_to_text:
    enabled: false
  suggested_questions:
    - 主角第一次和反派见面是哪一章？
    - 关于神秘信物的所有伏笔分布在哪些章节？
    - 帮我用前 3 章的风格写一段第 5 章的开篇 200 字
  suggested_questions_after_answer:
    enabled: true
  text_to_speech:
    enabled: false
    language: ''
    voice: ''
  user_input_form:
    - text-input:
        default: ''
        label: branch_id
        max_length: 64
        required: true
        variable: branch_id
    - text-input:
        default: local-default
        label: user_id
        max_length: 64
        required: false
        variable: user_id
    - number:
        default: 1
        label: current_chapter
        max: 9999
        min: 1
        required: false
        variable: current_chapter
  tool_box:
    custom_disclaimer: ''
    enabled: true
version: 0.1.0
